{{ define "main" }}
<content>
  <h1 class="chrome-title">{{ .Title }}</h1>
  {{ if .Content }}
  <div>
    {{ .Content }}
  </div>
  {{ end }}
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ else }}
    <li>No lists yet</li>
    {{ end }}
  </ul>
</content>
{{ end }}
