<button type="button" class="theme-toggle">
  <svg class="to-dark" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="to-light" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4" fill="currentColor"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
  </svg>
</button>
<nav id="main-nav" class="header-links">
  <a href="{{ "" | relURL }}">Main</a>
  {{- range .Site.Menus.main }}
  <span class="sep">·</span>
  <a href="{{ .URL }}">{{ .Name }}</a>
  {{- end }}
</nav>
<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector(".theme-toggle");
    var media = window.matchMedia("(prefers-color-scheme: dark)");

    function effective() {
      var theme = root.getAttribute("data-theme");
      if (theme === "light" || theme === "dark") return theme;
      return media.matches ? "dark" : "light";
    }

    function label() {
      var next = effective() === "dark" ? "light" : "dark";
      button.setAttribute("aria-label", "Switch to " + next + " theme");
    }

    label();
    button.addEventListener("click", function () {
      var next = effective() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });
    media.addEventListener("change", function () {
      if (!root.hasAttribute("data-theme")) label();
    });
  })();
</script>
