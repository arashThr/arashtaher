<nav id="main-nav" class="header-links">
  <a href="{{ "" | relURL }}">Main</a>
  {{- range .Site.Menus.main }}
  <span class="sep">·</span>
  <a href="{{ .URL }}">{{ .Name }}</a>
  {{- end }}
  <span class="sep">·</span>
  <button type="button" class="theme-toggle">
    <svg class="to-dark" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/>
    </svg>
    <svg class="to-light" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
    </svg>
  </button>
</nav>
<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector(".theme-toggle");
    var media = window.matchMedia("(prefers-color-scheme: dark)");

    function effective() {
      var theme = root.getAttribute("data-theme");
      if (theme === "light" || theme === "dark") return theme;
      return media.matches ? "dark" : "light";
    }

    function label() {
      var next = effective() === "dark" ? "light" : "dark";
      button.setAttribute("aria-label", "Switch to " + next + " theme");
    }

    label();
    button.addEventListener("click", function () {
      var next = effective() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });
    media.addEventListener("change", function () {
      if (!root.hasAttribute("data-theme")) label();
    });
  })();
</script>
