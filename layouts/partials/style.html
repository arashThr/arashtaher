<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  :root {
    --color-bg: #ffffff;
    --color-text: #000000;
    --color-rule: #000000;
    --color-muted: #666666;
    --font-mono: "IBM Plex Mono", "SF Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace;
    --max-width: 640px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #000000;
      --color-text: #ffffff;
      --color-rule: #ffffff;
      --color-muted: #999999;
    }
  }

  /* aliases used by existing templates */
  :root {
    --bg-color: var(--color-bg);
    --text-color: var(--color-text);
    --link-color: var(--color-text);
    --link-hover-color: var(--color-muted);
    --meta-color: var(--color-muted);
    --font-family: var(--font-mono);
    --bg-color-muted: color-mix(in srgb, var(--color-text) 6%, transparent);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: var(--font-mono);
    background: var(--color-bg);
    color: var(--color-text);
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 2rem 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  header,
  main,
  footer {
    width: 100%;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
    color: var(--color-text);
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }

  h2 {
    font-size: 1rem;
    margin: 0 0 0.75rem;
  }

  h3,
  h4 {
    font-size: 1rem;
    margin: 1.5rem 0 0.75rem;
  }

  p {
    margin-bottom: 0.5rem;
  }

  a {
    color: var(--color-text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  a:hover {
    text-decoration: none;
  }

  hr {
    border: none;
    border-top: 1px solid var(--color-rule);
    margin: 1.5rem 0;
  }

  /* Header / nav — directory row */
  header {
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--color-rule);
  }

  header button {
    display: none;
  }

  .header-links,
  header nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    color: var(--color-muted);
  }

  .header-links a,
  .header-links .sep,
  header nav a,
  header nav .sep {
    color: var(--color-muted);
  }

  /* Homepage hero */
  main > div:first-child h1 {
    margin-bottom: 0.25rem;
  }

  main > div:first-child p:first-of-type {
    color: var(--color-muted);
    margin-bottom: 0.75rem;
  }

  main > div:first-child p:nth-of-type(2) {
    margin-bottom: 0;
  }

  /* Sections separated like pucek rules */
  section {
    margin: 0;
    padding: 1.5rem 0 0;
    border-top: 1px solid var(--color-rule);
  }

  section + section {
    margin-top: 0;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 0 1rem;
  }

  li {
    margin-bottom: 0.125rem;
  }

  /* Blog / list pages keep readable spacing */
  content ul {
    margin-top: 0.75rem;
  }

  content p {
    margin-bottom: 0.75rem;
  }

  content li {
    margin-bottom: 0.35rem;
  }

  img {
    max-width: 100%;
    height: auto;
    margin: 1rem 0;
  }

  blockquote {
    border-left: 1px solid var(--color-rule);
    margin: 1rem 0;
    padding: 0.25rem 0 0.25rem 1rem;
    color: var(--color-muted);
  }

  blockquote p:last-child {
    margin-bottom: 0;
  }

  code,
  pre {
    font-family: var(--font-mono);
    font-size: 0.9em;
    color: var(--color-text);
    background: var(--bg-color-muted);
  }

  code {
    padding: 0.1em 0.3em;
  }

  pre {
    padding: 1rem;
    overflow-x: auto;
    margin: 1rem 0;
    border: 1px solid var(--color-rule);
  }

  pre code {
    background: transparent;
    padding: 0;
    font-size: 1em;
  }

  details {
    margin: 0;
  }

  details summary {
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  ::selection {
    background: var(--color-text);
    color: var(--color-bg);
  }

  .muted {
    color: var(--color-muted);
  }

  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--color-rule);
    font-size: 0.85rem;
    color: var(--color-muted);
  }

  footer a,
  footer .sep {
    color: var(--color-muted);
  }

  footer > div {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
  }

  /* Forms (contact / newsletter) */
  input,
  textarea,
  select,
  button {
    font-family: var(--font-mono);
    font-size: 14px;
  }

  input,
  textarea,
  select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--color-text);
    border-radius: 0;
    background: transparent;
    color: var(--color-text);
  }

  button,
  .button {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 0;
    background: var(--color-text);
    color: var(--color-bg);
    cursor: pointer;
  }

  @media (max-width: 480px) {
    body {
      padding: 1.5rem 1rem;
    }

    ul {
      margin-left: 0;
    }
  }
</style>
