<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  :root {
    --color-bg: #ffffff;
    --color-text: #000000;
    --color-muted: #666666;
    --font-mono: "IBM Plex Mono", "SF Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace;
    --max-width: 640px;
    --nav-width: 9.5rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #000000;
      --color-text: #ffffff;
      --color-muted: #999999;
    }
  }

  :root {
    --bg-color: var(--color-bg);
    --text-color: var(--color-text);
    --link-color: var(--color-text);
    --link-hover-color: var(--color-muted);
    --meta-color: var(--color-muted);
    --font-family: var(--font-mono);
    --bg-color-muted: color-mix(in srgb, var(--color-text) 6%, transparent);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  html,
  body,
  main,
  content,
  article,
  button,
  input,
  textarea,
  select {
    font-family: var(--font-mono);
  }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 2.5rem 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  header,
  main,
  footer {
    width: 100%;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.3;
    color: var(--color-text);
    font-family: var(--font-mono);
  }

  header,
  section > h2,
  details summary,
  .chrome-title {
    text-transform: uppercase;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  main.post > h1 {
    text-transform: none;
    letter-spacing: 0;
    font-size: 1.35rem;
    line-height: 1.35;
  }

  h2 {
    font-size: 1rem;
    margin: 0 0 0.75rem;
  }

  main.post h2,
  content h2,
  article h2 {
    text-transform: none;
    letter-spacing: 0;
    margin: 2rem 0 0.75rem;
  }

  h3,
  h4 {
    font-size: 1rem;
    margin: 1.5rem 0 0.75rem;
    text-transform: none;
    letter-spacing: 0;
  }

  p {
    margin-bottom: 0.85rem;
  }

  a {
    color: var(--color-text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  a:visited {
    color: var(--color-muted);
  }

  a:hover {
    text-decoration: none;
  }

  hr {
    display: none;
  }

  header {
    margin-bottom: 2rem;
  }

  header button {
    display: none;
  }

  .header-links,
  header nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.25rem;
    color: var(--color-muted);
  }

  .header-links a,
  .header-links .sep,
  header nav a,
  header nav .sep {
    color: var(--color-muted);
  }

  .social-links {
    margin-top: 1rem;
  }

  main > div:first-child {
    margin-bottom: 1rem;
  }

  main > div:first-child h1 {
    margin-bottom: 0.35rem;
  }

  main > div:first-child p:first-of-type {
    color: var(--color-muted);
    margin-bottom: 0.85rem;
  }

  main > div:first-child p:nth-of-type(2) {
    margin-bottom: 0;
  }

  section {
    margin: 0;
    padding: 1.25rem 0 0;
    border: none;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 0.5rem 1rem;
  }

  li {
    margin-bottom: 0.2rem;
  }

  content ul,
  main.post ul,
  article ul {
    margin: 0.75rem 0 1rem 1.1rem;
    list-style: disc;
  }

  content ol,
  main.post ol {
    margin: 0.75rem 0 1rem 1.25rem;
    padding-left: 1rem;
  }

  content li,
  main.post li {
    margin-bottom: 0.4rem;
  }

  img {
    max-width: 100%;
    height: auto;
    margin: 1rem 0;
  }

  blockquote {
    border-left: 1px solid var(--color-text);
    margin: 1.25rem 0;
    padding: 0.15rem 0 0.15rem 1rem;
    color: var(--color-muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0 1.5rem;
    font-size: 0.95em;
  }

  th,
  td {
    text-align: left;
    padding: 0.35rem 0.5rem 0.35rem 0;
    vertical-align: top;
  }

  code,
  pre,
  .hljs {
    font-family: var(--font-mono) !important;
  }

  code {
    font-size: 0.9em;
    background: var(--bg-color-muted);
    padding: 0.1em 0.3em;
  }

  pre {
    padding: 1rem;
    overflow-x: auto;
    margin: 1.25rem 0;
    background: var(--bg-color-muted);
  }

  pre code,
  pre .hljs {
    background: transparent !important;
    padding: 0;
    font-size: 0.9em;
    color: inherit;
  }

  details summary {
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  ::selection {
    background: var(--color-text);
    color: var(--color-bg);
  }

  .muted,
  .post-date {
    color: var(--color-muted);
  }

  .post-list {
    list-style: none;
    margin: 0.5rem 0 0;
    padding: 0;
  }

  .post-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.25rem;
    margin-bottom: 0.45rem;
  }

  .post-list a {
    min-width: 0;
  }

  .post-list time {
    color: var(--color-muted);
    white-space: nowrap;
    margin-left: auto;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.1rem;
    margin-top: 1rem;
  }

  .tag-cloud a {
    color: var(--color-muted);
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: var(--color-muted);
  }

  input,
  textarea,
  select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--color-text);
    border-radius: 0;
    background: transparent;
    color: var(--color-text);
    font-size: 14px;
  }

  button,
  .button {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 0;
    background: var(--color-text);
    color: var(--color-bg);
    cursor: pointer;
    font-size: 14px;
  }

  .appt-button {
    margin-top: 1.25rem;
  }

  .appt-button button,
  .appt-button a,
  .appt-button [role="button"] {
    background: var(--color-text) !important;
    color: var(--color-bg) !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    font-family: var(--font-mono) !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.05em !important;
    padding: 0.7rem 1rem !important;
  }

  @media (min-width: 900px) {
    body {
      display: grid;
      grid-template-columns: var(--nav-width) minmax(0, var(--max-width));
      justify-content: center;
      column-gap: 3rem;
      max-width: none;
      padding: 2.75rem 2rem 4rem;
      align-items: start;
    }

    header {
      grid-column: 1;
      grid-row: 1 / span 2;
      position: sticky;
      top: 2.75rem;
      margin: 0;
    }

    header nav {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4rem;
    }

    header nav .sep {
      display: none;
    }

    .social-links {
      flex-direction: column;
      align-items: flex-start;
      margin-top: 1.5rem;
    }

    .social-links .sep {
      display: none;
    }

    main {
      grid-column: 2;
      grid-row: 1;
    }

    footer {
      grid-column: 2;
      grid-row: 2;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 1.5rem 1rem;
    }

    ul {
      margin-left: 0;
    }
  }
</style>
