baseURL = "https://arashtaher.com"
languageCode = "en-us"
title = "Arash Taher"
author = "Arash Taher"
enableRobotsTXT = true

# Enable taxonomies for tags
[taxonomies]
  tag = "tags"
[permalinks]
  blog = "/blog/:slug/"
  tags = "/tags/:slug"

[params]
  description = "Arash Taher personal website"
  author = "Arash Taher"

  favicon = "images/favicon.png"

# Menu configuration
[menu]
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  [[menu.main]]
    name = "Lists"
    url = "/lists/"
    weight = 3
  [[menu.main]]
    name = "CV"
    url = "/cv/"
    weight = 4

  # These "images" are used for the structured data templates. This will show up, when
  # services like Twitter or Slack want to generate a preview of a link to your site.
  # See https://gohugo.io/templates/internal#twitter-cards and
  # https://gohugo.io/templates/internal#open-graph.
  # images = ["images/share.png"]

  # opengraph structured data template.
  # See https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
  title = "Arash Taher"

# Highlight fenced code at build time so pages do not load Highlight.js.
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true